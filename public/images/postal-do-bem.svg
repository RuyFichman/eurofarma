<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B3155" stop-opacity="0.52" />
      <stop offset="0.5" stop-color="#0B3155" stop-opacity="0.14" />
      <stop offset="1" stop-color="#0B3155" stop-opacity="0.28" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#082C50" flood-opacity="0.22" />
    </filter>
  </defs>

  <image
    x="0"
    y="0"
    width="1080"
    height="1350"
    preserveAspectRatio="xMidYMid slice"
    xlink:href="postal-do-bem-background.png"
  />
  <rect width="1080" height="1350" fill="url(#shade)" />

  <g transform="translate(92 92)" filter="url(#shadow)">
    <rect width="278" height="54" rx="27" fill="#FFFFFF" fill-opacity="0.94" />
    <path d="M31 15c8 9.4 15.5 17.5 15.5 26.8a15.5 15.5 0 0 1-31 0C15.5 32.5 23 24.4 31 15Z" fill="#3A7AB8" />
    <text x="59" y="36" fill="#174E7D" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="1.4">POSTAL DO BEM</text>
  </g>

  <g transform="translate(92 224)" filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <text fill="#FFFFFF" font-size="64" font-weight="700">
      <tspan x="0" y="0">Meu gesto faz parte</tspan>
      <tspan x="0" y="76">de uma corrente</tspan>
      <tspan x="0" y="152">de cuidado.</tspan>
    </text>
    <text fill="#FFFFFF" fill-opacity="0.94" font-size="31" font-weight="400">
      <tspan x="0" y="224">Com o Lactare, apoio à doação</tspan>
      <tspan x="0" y="266">de leite humano e ajudo essa</tspan>
      <tspan x="0" y="308">causa a chegar mais longe.</tspan>
    </text>
  </g>

  <g transform="translate(92 1203)" font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <text fill="#FFFFFF" font-size="32" font-weight="700">NutriLink</text>
    <text x="143" fill="#FFFFFF" fill-opacity="0.85" font-size="24">com Lactare, banco de leite humano da Eurofarma</text>
  </g>
</svg>
